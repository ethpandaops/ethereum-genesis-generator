name: Build docker image
on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:
  pull_request_target:
    types: [labeled]  # runs in base-branch context with secrets, needed to push images from fork PRs
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.setup.outputs.platforms }}
      tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare Matrix
        id: setup
        uses: ./.github/actions/prepare
      - name: Resolve tag
        id: resolve_tag
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # PR builds are tagged pr-<number>, never with the PR's branch name: a
          # PR (from a fork, too) could otherwise name its branch after any
          # existing tag, such as master, and overwrite it. The image mirror
          # only accepts pr-* tags from pull_request_target builds.
          if [[ "${{ github.event_name }}" == "pull_request_target" || "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=ghcr.io/ethpandaops/ethereum-genesis-generator:pr-${PR_NUMBER}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ steps.setup.outputs.tag }}" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs:
      - prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include: ${{fromJson(needs.prepare.outputs.platforms)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/deploy
        id: deploy
        with:
          platform: ${{ matrix.platform }}
          tag: ${{ needs.prepare.outputs.tag }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-docker-image') }}
      - name: Attest and mirror to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-docker-image')
        uses: ethpandaops/actions/mirror-image@dab9cb304b6a1dd648e2f1acef6169f7095f515e
        with:
          tags: ${{ needs.prepare.outputs.tag }}-${{ matrix.slug }}
          digest: ${{ steps.deploy.outputs.digest }}
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
      - name: Export image artifact
        if: matrix.platform == 'linux/amd64'
        run: docker save "${{ needs.prepare.outputs.tag }}-linux-amd64" | gzip > /tmp/image.tar.gz
      - name: Upload image artifact
        if: matrix.platform == 'linux/amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-image
          path: /tmp/image.tar.gz
          retention-days: 1

  check-genesis-output:
    name: Check consensus spec values (${{ matrix.preset }})
    needs:
      - prepare
      - deploy
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [mainnet, minimal]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-image
          path: /tmp
      - name: Load Docker image
        run: |
          docker load < /tmp/image.tar.gz
          docker tag "${{ needs.prepare.outputs.tag }}-linux-amd64" ethereum-genesis-generator:ci-test
      - name: Run genesis (${{ matrix.preset }})
        run: |
          mkdir -p output
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD/output:/data" \
            -v "$PWD/test/test-cases/${{ matrix.preset }}-spec-check.env:/config/values.env" \
            ethereum-genesis-generator:ci-test all
      - name: Install pyyaml
        run: pip install pyyaml --quiet
      - name: Download upstream consensus-specs config
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/ethereum/consensus-specs/master/configs/${{ matrix.preset }}.yaml" \
            -o /tmp/spec-${{ matrix.preset }}.yaml
      - name: Compare genesis output config against upstream spec
        run: |
          python3 .github/check-consensus-spec-values.py \
            --our-config output/metadata/config.yaml \
            --spec-config /tmp/spec-${{ matrix.preset }}.yaml

  manifest:
    needs:
      - prepare
      - deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-docker-image')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/manifest
        id: manifest
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          repository: ethpandaops/ethereum-genesis-generator
          platforms: ${{ needs.prepare.outputs.platforms }}
      - name: Attest and mirror to Docker Hub
        uses: ethpandaops/actions/mirror-image@dab9cb304b6a1dd648e2f1acef6169f7095f515e
        with:
          tags: ${{ needs.prepare.outputs.tag }}
          digest: ${{ steps.manifest.outputs.digest }}
          attest-platforms: "false"
          mirror-url: ${{ secrets.IMAGE_MIRROR_URL }}
