name: Build and publish docker image

on:
  push:
    branches:
      - master
    tags:
      - '**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ethpandaops/ethereum-genesis-generator

jobs:
  prepare:
    name: Resolve immutable source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      target_tag: ${{ steps.resolve.outputs.target_tag }}
      immutable_tag: ${{ steps.resolve.outputs.immutable_tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve image metadata
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ethpandaops/ethereum-genesis-generator
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha
            type=match,event=tag,pattern=^v\d+\.\d+\.\d+$,group=0
            type=match,event=tag,pattern=^verkle-gen-v\d+\.\d+\.\d+$,group=0
            type=match,event=tag,pattern=^ephemery-v\d+\.\d+\.\d+$,group=0
      - name: Resolve publication policy
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          METADATA_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Source must resolve to a full commit SHA" >&2
            exit 1
          }

          target_tag=""
          publish=false
          if [[ "$EVENT_NAME" == push || "$EVENT_NAME" == workflow_dispatch ]]; then
            target_tag="$IMAGE_REPOSITORY:$METADATA_VERSION"
            publish=true
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=$IMAGE_REPOSITORY:sha-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build image without credentials
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile
          tags: ethereum-genesis-generator:${{ needs.prepare.outputs.source_sha }}-${{ matrix.slug }}
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=build-${{ matrix.slug }}
          cache-to: type=gha,scope=build-${{ matrix.slug }},mode=max
      - name: Export checksummed image
        shell: bash
        env:
          IMAGE: ethereum-genesis-generator:${{ needs.prepare.outputs.source_sha }}-${{ matrix.slug }}
          SLUG: ${{ matrix.slug }}
        run: |
          docker save "$IMAGE" | gzip > "/tmp/image-$SLUG.tar.gz"
          (cd /tmp && sha256sum "image-$SLUG.tar.gz" > "image-$SLUG.tar.gz.sha256")
      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.slug }}
          path: |
            /tmp/image-${{ matrix.slug }}.tar.gz
            /tmp/image-${{ matrix.slug }}.tar.gz.sha256
          retention-days: 1
          compression-level: 0

  check-genesis-output:
    name: Check consensus spec values (${{ matrix.preset }})
    needs:
      - prepare
      - build
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [mainnet, minimal]
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Download amd64 image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-linux-amd64
          path: /tmp/image
      - name: Verify and load Docker image
        shell: bash
        run: |
          (cd /tmp/image && sha256sum -c image-linux-amd64.tar.gz.sha256)
          docker load --input /tmp/image/image-linux-amd64.tar.gz
          docker tag \
            "ethereum-genesis-generator:${{ needs.prepare.outputs.source_sha }}-linux-amd64" \
            ethereum-genesis-generator:ci-test
      - name: Run genesis (${{ matrix.preset }})
        run: |
          mkdir -p output
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD/output:/data" \
            -v "$PWD/test/test-cases/${{ matrix.preset }}-spec-check.env:/config/values.env" \
            ethereum-genesis-generator:ci-test all
      - name: Install pyyaml
        run: pip install pyyaml --quiet
      - name: Download upstream consensus-specs config
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/ethereum/consensus-specs/master/configs/${{ matrix.preset }}.yaml" \
            -o /tmp/spec-${{ matrix.preset }}.yaml
      - name: Compare genesis output config against upstream spec
        run: |
          python3 .github/check-consensus-spec-values.py \
            --our-config output/metadata/config.yaml \
            --spec-config /tmp/spec-${{ matrix.preset }}.yaml

  publish:
    name: Publish checksummed images
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download amd64 image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-linux-amd64
          path: /tmp/images
      - name: Download arm64 image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-linux-arm64
          path: /tmp/images
      - name: Verify and load built images
        shell: bash
        run: |
          (cd /tmp/images && sha256sum -c image-linux-amd64.tar.gz.sha256)
          (cd /tmp/images && sha256sum -c image-linux-arm64.tar.gz.sha256)
          docker load --input /tmp/images/image-linux-amd64.tar.gz
          docker load --input /tmp/images/image-linux-arm64.tar.gz
      - name: Log in to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Push architecture images and digest-bound manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TARGET_TAG: ${{ needs.prepare.outputs.target_tag }}
          IMMUTABLE_TAG: ${{ needs.prepare.outputs.immutable_tag }}
        run: |
          push_platform() {
            local slug="$1"
            local source="ethereum-genesis-generator:$SOURCE_SHA-$slug"
            local target="$IMMUTABLE_TAG-$slug"
            local output digest

            docker tag "$source" "$target"
            output="$(docker push "$target")"
            printf '%s\n' "$output" >&2
            digest="$(printf '%s\n' "$output" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Could not determine digest for $target" >&2
              return 1
            }
            printf '%s' "$digest"
          }

          amd64_digest="$(push_platform linux-amd64)"
          arm64_digest="$(push_platform linux-arm64)"

          docker buildx imagetools create --dry-run \
            --tag "$IMMUTABLE_TAG" \
            --tag "$TARGET_TAG" \
            "$IMAGE_REPOSITORY@$amd64_digest" \
            "$IMAGE_REPOSITORY@$arm64_digest"
          docker buildx imagetools create \
            --tag "$IMMUTABLE_TAG" \
            --tag "$TARGET_TAG" \
            "$IMAGE_REPOSITORY@$amd64_digest" \
            "$IMAGE_REPOSITORY@$arm64_digest"
