name: Validate PR image

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Dockerfile
          tags: ethereum-genesis-generator:${{ github.event.pull_request.head.sha }}-${{ matrix.slug }}
          push: false
          load: true
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=build-${{ matrix.slug }}
          cache-to: type=gha,scope=build-${{ matrix.slug }},mode=max
      - name: Export checksummed image
        shell: bash
        env:
          IMAGE: ethereum-genesis-generator:${{ github.event.pull_request.head.sha }}-${{ matrix.slug }}
          SLUG: ${{ matrix.slug }}
        run: |
          docker save "$IMAGE" | gzip > "/tmp/image-$SLUG.tar.gz"
          (cd /tmp && sha256sum "image-$SLUG.tar.gz" > "image-$SLUG.tar.gz.sha256")
      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.slug }}
          path: |
            /tmp/image-${{ matrix.slug }}.tar.gz
            /tmp/image-${{ matrix.slug }}.tar.gz.sha256
          retention-days: 1
          compression-level: 0

  check-genesis-output:
    name: Check consensus spec values (${{ matrix.preset }})
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [mainnet, minimal]
    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download amd64 image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-linux-amd64
          path: /tmp/image
      - name: Verify and load Docker image
        shell: bash
        run: |
          (cd /tmp/image && sha256sum -c image-linux-amd64.tar.gz.sha256)
          docker load --input /tmp/image/image-linux-amd64.tar.gz
          docker tag \
            "ethereum-genesis-generator:${{ github.event.pull_request.head.sha }}-linux-amd64" \
            ethereum-genesis-generator:ci-test
      - name: Run genesis (${{ matrix.preset }})
        run: |
          mkdir -p output
          docker run --rm -u "$(id -u):$(id -g)" \
            -v "$PWD/output:/data" \
            -v "$PWD/test/test-cases/${{ matrix.preset }}-spec-check.env:/config/values.env" \
            ethereum-genesis-generator:ci-test all
      - name: Install pyyaml
        run: pip install pyyaml --quiet
      - name: Download upstream consensus-specs config
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/ethereum/consensus-specs/master/configs/${{ matrix.preset }}.yaml" \
            -o /tmp/spec-${{ matrix.preset }}.yaml
      - name: Compare genesis output config against upstream spec
        run: |
          python3 .github/check-consensus-spec-values.py \
            --our-config output/metadata/config.yaml \
            --spec-config /tmp/spec-${{ matrix.preset }}.yaml
